name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # GitHub's Intel (macos-13) hosted runners have had extended capacity
    # outages leaving jobs queued indefinitely; Apple Silicon runners can
    # cross-compile x86_64 fine (see the release workflow), so a single
    # native macos-14 job covers correctness and both architectures build.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all
      - run: cargo build --release
      - run: cargo build --release --target x86_64-apple-darwin

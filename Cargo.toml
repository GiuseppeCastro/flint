[package]
name = "flint"
version = "0.1.0"
edition = "2021"
description = "Fast, local-first terminal autocomplete and history ranking for Zsh"
license = "MIT"
repository = "https://github.com/GiuseppeCastro/flint"
rust-version = "1.74"

[lib]
name = "flint"
path = "src/lib.rs"

[[bin]]
name = "flint"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1.10"
crossterm = "0.27"

[dev-dependencies]
criterion = "0.5"
tempfile = "3.10"
rexpect = "0.5"

[[bench]]
name = "ranking"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
